name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # `check` covers both projects: the SvelteKit app against the DOM, and the
      # worker against the workerd globals. They cannot share a tsconfig.
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: Play a round in a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Only Chromium: this is checking our own markup and layout, not how many
      # engines can render it.
      - run: npx playwright install --with-deps chromium

      # `wrangler dev` reads local secrets from .dev.vars, not the environment,
      # and the build needs a .env for the pages. Neither is committed, so make
      # a throwaway pair. This secret only ever signs cookies for a worker that
      # lives for the length of this job.
      - name: Local env for the dev worker
        run: |
          SECRET="$(openssl rand -hex 32)"
          printf 'SESSION_SECRET=%s\n' "$SECRET" > .dev.vars
          printf 'SESSION_SECRET=%s\nPUBLIC_GAME_SERVER=\n' "$SECRET" > .env

      # Starts the worker itself, via the webServer in playwright.config.ts.
      # A round deals real articles from Wikipedia, so this touches the network.
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    # Pull requests are verified but never deployed, including PRs from forks,
    # which must not be able to reach the deployment credentials.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, e2e]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://citationneededgame.com
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      # SESSION_SECRET is not set here. Worker secrets outlive a deployment, so
      # it stays whatever `wrangler secret put` last set it to.
      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
